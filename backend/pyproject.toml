[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "propintel-backend"
version = "0.1.0"
description = "FastAPI backend, data models, and intelligence layer for PropIntel."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "areebarshad" }]
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # data
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",          # sync driver for Alembic
    "alembic>=1.13",
    "pgvector>=0.3.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # auth
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.9",
    "email-validator>=2.1",
    # optional shared rate limiting (falls back to in-memory when not configured)
    "redis[asyncio]>=5.0",
    # ai
    "openai>=1.30",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    # resolution
    "rapidfuzz>=3.9",
    # ops
    "sentry-sdk[fastapi]>=2.10",
    "prometheus-fastapi-instrumentator>=7.0",
    "structlog>=24.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
digest = ["weasyprint>=62.0", "markdown-it-py>=3.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
