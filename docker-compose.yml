name: propintel

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: propintel-db
    environment:
      POSTGRES_USER: propintel
      POSTGRES_PASSWORD: propintel
      POSTGRES_DB: propintel
    ports:
      - "5433:5432"      # 5433 on the host so a local Postgres install can coexist
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Without this the backend races the database on a cold `compose up`.
      test: ["CMD-SHELL", "pg_isready -U propintel -d propintel"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: propintel-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROPINTEL_DATABASE_URL: postgresql+asyncpg://propintel:propintel@db:5432/propintel
      PROPINTEL_LLM__API_KEY: ${ANTHROPIC_API_KEY:-}
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
