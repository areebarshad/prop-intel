# PropIntel seed firms — Virginia commercial real estate.
#
# Coverage: Northern Virginia and Richmond first, with Hampton Roads firms
# included where they are material regional players (Armada Hoffler, S.L.
# Nusbaum) or operate across both markets.
#
# ─────────────────────────────────────────────────────────────────────────────
# `verified: true` means the domain returned 200 from a live HEAD request on
# 2026-08-08, following redirects, and the row records the final canonical URL.
# `verified: false` means it did not resolve and needs a human to supply the
# real domain — a wrong domain either fails loudly (fine) or silently crawls an
# unrelated company and attributes its filings to a firm that never made them.
#
#   uv run propintel-ingest verify-seeds        # re-check; sites move
# ─────────────────────────────────────────────────────────────────────────────
#
# Field notes:
#   aliases      Trade names, former names, and the shapes a permit clerk types.
#                These seed `firm_aliases` directly, so the first filing under a
#                known alias resolves exactly instead of costing an LLM call.
#   focus_areas  Free text; drives the search facets.
#   asset_classes Must be values from app.models.enums.AssetClass.
#   firm_type    Must be a value from app.models.enums.FirmType.
#   localities   Counties and independent cities, matching permit-portal naming.
#   careers_path Relative path appended to website for the careers crawl. Null
#                means "discover it" — the crawler looks for common paths.

version: 1
default_state: VA

firms:
