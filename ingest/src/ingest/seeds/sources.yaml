  # ── Trade press ────────────────────────────────────────────────────────────
  #
  # News sources are for corroboration and narrative, never as the primary
  # record of a filing — a permit is a fact, a news article is a report of one.
  # Respect each publisher's robots.txt; webscraper-core enforces it.

  - name: Virginia Business — Real Estate
    kind: news
    locality: null
    base_url: https://virginiabusiness.com/category/real-estate/
    cadence_hours: 12
    scrape_task: press_release
    config:
      follow_links: true
      # Match links that look like individual article pages (date slug in path)
      link_pattern: 'virginiabusiness\.com/\d{4}/\d{2}/'
      max_links: 30
    verified: false

  - name: Richmond BizSense — Real Estate
    kind: news
    locality: Richmond City
    base_url: https://richmondbizsense.com/category/real-estate/
    cadence_hours: 12
    scrape_task: press_release
    config:
      follow_links: true
      link_pattern: 'richmondbizsense\.com/\d{4}/\d{2}/'
      max_links: 30
    verified: false
